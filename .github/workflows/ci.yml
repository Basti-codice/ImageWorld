name: CI

# Quick feedback on pull requests (the Windows build runs on pushes/tags, see build-windows.yml).
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # lifecycle scripts (Electron / ffmpeg downloads) are not needed for typecheck + vitest
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
